<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>微信 (1)</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; position: relative; user-select: none; -webkit-user-select: none; }

        /* 微信伪装 */
        .wechat-shell { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: flex; flex-direction: column; background: #ededed; overflow: hidden; }
        .wechat-header { height: 44px; background: #ededed; border-bottom: 0.5px solid #d6d6d6; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; padding-top: env(safe-area-inset-top, 0); z-index: 100; position: relative; }
        .wechat-header .back { color: #007aff; font-size: 16px; display: flex; align-items: center; gap: 4px; }
        .wechat-header .title { font-size: 17px; font-weight: 600; color: #000; position: absolute; left: 50%; transform: translateX(-50%); }
        .wechat-header .more { color: #000; font-size: 20px; }
        .wechat-chat { flex: 1; overflow-y: auto; padding: 15px; background: #ededed; position: relative; }
        .chat-msg { display: flex; margin-bottom: 15px; align-items: flex-start; animation: msgSlide 0.4s ease; }
        @keyframes msgSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .chat-avatar { width: 40px; height: 40px; border-radius: 6px; background: #07c160; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .chat-bubble { max-width: 70%; padding: 10px 14px; border-radius: 4px; font-size: 15px; line-height: 1.5; word-break: break-word; position: relative; margin-left: 10px; background: #fff; color: #000; }
        .chat-bubble::before { content: ''; position: absolute; left: -6px; top: 14px; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 6px solid #fff; }
        .chat-msg.self { flex-direction: row-reverse; }
        .chat-msg.self .chat-bubble { margin-left: 0; margin-right: 10px; background: #95ec69; }
        .chat-msg.self .chat-bubble::before { left: auto; right: -6px; border-right: none; border-left: 6px solid #95ec69; }
        .chat-msg.self .chat-avatar { background: #007aff; }
        .wechat-input { height: 50px; background: #f7f7f7; border-top: 0.5px solid #e5e5e5; display: flex; align-items: center; padding: 0 12px; gap: 10px; z-index: 100; position: relative; }
        .wechat-input .voice-icon { font-size: 24px; color: #333; }
        .wechat-input .input-box { flex: 1; height: 36px; background: #fff; border-radius: 4px; display: flex; align-items: center; padding: 0 10px; color: #999; font-size: 15px; border: 0.5px solid #e5e5e5; }
        .wechat-input .emoji-icon { font-size: 24px; }
        .wechat-input .plus-icon { font-size: 24px; color: #333; }

        /* 摄像头 */
        #cameraVideo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: 0; transition: opacity 0.5s ease; }
        #cameraVideo.active { opacity: 0.4; }
        .camera-toggle { position: fixed; top: 60px; right: 15px; background: rgba(0,0,0,0.6); border: 1px solid #fff; color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; z-index: 10002; display: none; }
        .camera-toggle.show { display: block; }

        /* ==================== 蚊子样式（更大） ==================== */
        .mosquito { position: fixed; width: 140px; height: 140px; z-index: 9999; cursor: pointer; filter: drop-shadow(0 0 15px rgba(255,255,255,0.6)) drop-shadow(4px 6px 12px rgba(0,0,0,0.8)); transition: transform 0.15s ease; will-change: left, top, transform; }
        .mosquito.dead { animation: none !important; opacity: 0.4; filter: grayscale(100%) sepia(100%) hue-rotate(-50deg) saturate(300%) drop-shadow(0 0 10px #ff0000); }
        .mosquito svg { width: 100%; height: 100%; }
        .wing-left, .wing-right { animation: wingFlap 0.035s infinite alternate; transform-origin: center; }
        .wing-right { animation-delay: 0.005s; }
        @keyframes wingFlap { 0% { transform: scaleY(1) rotate(0deg); } 100% { transform: scaleY(0.12) rotate(35deg); } }
        .mosquito.baby { width: 90px; height: 90px; opacity: 0.8; }
        .mosquito.giant { width: 200px; height: 200px; filter: drop-shadow(0 0 30px rgba(255,80,80,1)); }
        .mosquito.fast { filter: drop-shadow(0 0 20px rgba(255,200,0,0.9)); }
        .mosquito.tiger { filter: drop-shadow(0 0 15px rgba(255,255,255,0.6)) drop-shadow(4px 6px 12px rgba(0,0,0,0.8)); }
        .mosquito.poison { filter: drop-shadow(0 0 20px rgba(0,255,100,0.8)) drop-shadow(4px 6px 12px rgba(0,0,0,0.8)); }
        .mosquito.male { filter: drop-shadow(0 0 15px rgba(100,200,255,0.6)) drop-shadow(4px 6px 12px rgba(0,0,0,0.8)); }
        .mosquito.female { filter: drop-shadow(0 0 15px rgba(255,100,150,0.6)) drop-shadow(4px 6px 12px rgba(0,0,0,0.8)); }
        .mosquito.gold { filter: drop-shadow(0 0 25px rgba(255,215,0,0.9)) drop-shadow(4px 6px 12px rgba(0,0,0,0.8)); }
        .mosquito.ghost { opacity: 0.45; filter: drop-shadow(0 0 15px rgba(200,230,255,0.5)) drop-shadow(4px 6px 12px rgba(0,0,0,0.6)); }

        /* ==================== 血迹 & 爆炸粒子 ==================== */
        .blood-splatter { position: fixed; width: 120px; height: 120px; pointer-events: none; z-index: 9998; animation: bloodFade 2s forwards; }
        .blood-splatter::before { content: ''; position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, #ff0000 0%, #aa0000 30%, #660000 60%, transparent 80%); border-radius: 50%; transform: scale(1.5); }
        .blood-splatter::after { content: '啪！'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 6px rgba(0,0,0,1); }
        @keyframes bloodFade { 0% { opacity: 1; transform: scale(1) rotate(0deg); } 30% { opacity: 0.9; transform: scale(1.8) rotate(20deg); } 100% { opacity: 0; transform: scale(0.2) rotate(-40deg); } }

        .particle { position: fixed; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; z-index: 10002; animation: particleFly 0.8s forwards; }
        @keyframes particleFly { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translate(var(--px), var(--py)) scale(0); } }

        .screen-shake { animation: shake 0.3s ease; }
        @keyframes shake { 0%, 100% { transform: translate(0,0); } 20% { transform: translate(-5px, 5px); } 40% { transform: translate(5px, -5px); } 60% { transform: translate(-5px, -5px); } 80% { transform: translate(5px, 5px); } }

        .crit-text { position: fixed; font-size: 40px; font-weight: bold; color: #ff0000; pointer-events: none; z-index: 10003; animation: critUp 0.8s forwards; text-shadow: 0 0 20px rgba(255,0,0,1), 3px 3px 0 #fff; }
        @keyframes critUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-120px) scale(2) rotate(-10deg); opacity: 0; } }

        /* ==================== 电蚊拍效果 ==================== */
        .electric-swat { position: fixed; border-radius: 50%; pointer-events: none; z-index: 10005; animation: electricExpand 0.5s forwards; }
        @keyframes electricExpand { 0% { width: 0; height: 0; opacity: 1; border: 4px solid #00ffff; box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; } 50% { width: 250px; height: 250px; opacity: 0.8; border: 3px solid #ffffff; box-shadow: 0 0 40px #00ffff, 0 0 80px #00ffff, inset 0 0 30px rgba(0,255,255,0.3); } 100% { width: 300px; height: 300px; opacity: 0; border: 1px solid #00ffff; box-shadow: 0 0 60px #00ffff; } }

        .lightning-bolt { position: fixed; width: 3px; background: linear-gradient(to bottom, #00ffff, #ffffff, #00ffff); pointer-events: none; z-index: 10006; animation: lightningFlash 0.3s forwards; transform-origin: top; }
        @keyframes lightningFlash { 0% { opacity: 1; height: 0; transform: scaleY(1); } 50% { opacity: 1; height: 80px; transform: scaleY(1.2); } 100% { opacity: 0; height: 100px; transform: scaleY(0.5); } }

        .zap-text { position: fixed; font-size: 28px; font-weight: bold; color: #00ffff; pointer-events: none; z-index: 10007; animation: zapUp 0.6s forwards; text-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff; }
        @keyframes zapUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-60px) scale(1.5); opacity: 0; } }

        /* ==================== UI 面板 ==================== */
        .game-ui { position: fixed; top: 50px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 10000; pointer-events: none; }
        .game-ui > * { pointer-events: auto; }
        .kill-counter { background: rgba(0,0,0,0.8); border: 1px solid #ff4444; padding: 10px 16px; border-radius: 12px; font-size: 14px; color: #ccc; box-shadow: 0 0 20px rgba(255,68,68,0.4); backdrop-filter: blur(10px); }
        .kill-counter span { color: #ff4444; font-weight: bold; font-size: 24px; }
        .timer-box { background: rgba(0,0,0,0.8); border: 1px solid #ffaa00; padding: 10px 16px; border-radius: 12px; font-size: 14px; color: #ccc; box-shadow: 0 0 20px rgba(255,170,0,0.4); backdrop-filter: blur(10px); text-align: center; }
        .timer-box .timer-value { color: #ffaa00; font-weight: bold; font-size: 24px; display: block; }
        .timer-box.urgent { border-color: #ff0000; animation: timerPulse 0.4s infinite; }
        .timer-box.urgent .timer-value { color: #ff0000; }
        @keyframes timerPulse { 0%, 100% { box-shadow: 0 0 20px rgba(255,0,0,0.4); } 50% { box-shadow: 0 0 40px rgba(255,0,0,0.8); } }
        .mode-badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
        .badge { background: rgba(0,0,0,0.7); border: 1px solid #555; padding: 5px 12px; border-radius: 14px; font-size: 12px; color: #aaa; cursor: pointer; transition: all 0.3s; }
        .badge.active { border-color: #ff4444; color: #ff4444; background: rgba(255,68,68,0.2); }
        .badge.swat-badge { border: 2px solid #ff0000; color: #ffff00; background: #cc0000; font-size: 15px; padding: 10px 18px; font-weight: bold; animation: swatGlow 1s infinite; text-shadow: 0 0 5px rgba(255,255,0,0.5); }
        .badge.swat-badge.cooldown { border-color: #666; color: #999; background: #444; animation: none; text-shadow: none; }
        @keyframes swatGlow { 0%, 100% { box-shadow: 0 0 10px rgba(255,0,0,0.6), 0 0 20px rgba(255,0,0,0.3); } 50% { box-shadow: 0 0 25px rgba(255,255,0,0.9), 0 0 50px rgba(255,0,0,0.7); } }

        /* 开始界面 */
        .start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10001; color: #fff; padding: 20px; text-align: center; }
        .start-overlay .wx-icon { font-size: 70px; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .start-overlay h1 { font-size: 26px; margin-bottom: 10px; color: #07c160; }
        .start-overlay p { font-size: 15px; margin-bottom: 6px; opacity: 0.7; line-height: 1.6; }
        .start-overlay .mode-select { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; justify-content: center; }
        .mode-btn { background: rgba(255,255,255,0.1); border: 1px solid #444; color: #ccc; padding: 12px 20px; border-radius: 10px; font-size: 14px; cursor: pointer; transition: all 0.3s; min-width: 100px; }
        .mode-btn:hover, .mode-btn.selected { border-color: #ff4444; color: #ff4444; background: rgba(255,68,68,0.1); }
        .start-btn { background: linear-gradient(135deg, #07c160, #05a050); color: white; border: none; padding: 18px 60px; border-radius: 30px; font-size: 18px; cursor: pointer; animation: pulse 2s infinite; margin-top: 15px; font-weight: bold; box-shadow: 0 0 30px rgba(7,193,96,0.4); }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* 假弹窗 */
        .fake-alert-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); display: none; justify-content: center; align-items: center; z-index: 20000; animation: fadeIn 0.3s ease; }
        .fake-alert-overlay.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .fake-alert-box { background: #1a1a1a; border: 2px solid #ff4444; border-radius: 16px; padding: 30px 25px; max-width: 320px; width: 90%; text-align: center; box-shadow: 0 0 50px rgba(255,68,68,0.5); animation: alertPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes alertPop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .fake-alert-box .alert-icon { font-size: 50px; margin-bottom: 15px; }
        .fake-alert-box h2 { color: #ff4444; font-size: 20px; margin-bottom: 12px; }
        .fake-alert-box p { color: #ccc; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        .fake-alert-box .alert-progress { width: 100%; height: 4px; background: #333; border-radius: 2px; margin-bottom: 20px; overflow: hidden; }
        .fake-alert-box .alert-progress-bar { height: 100%; background: #ff4444; width: 0%; animation: progressFill 3s linear forwards; }
        @keyframes progressFill { to { width: 100%; } }
        .fake-alert-box button { background: #ff4444; color: white; border: none; padding: 12px 30px; border-radius: 8px; font-size: 15px; cursor: pointer; width: 100%; font-weight: bold; }

        /* 吸血效果 */
        .blood-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5000; opacity: 0; transition: opacity 0.5s ease; background: radial-gradient(circle at var(--bite-x, 50%) var(--bite-y, 50%), rgba(180, 0, 0, 0.8) 0%, rgba(100, 0, 0, 0.5) 30%, transparent 70%); box-shadow: inset 0 0 200px rgba(80, 0, 0, 0.7); }
        .blood-overlay.active { opacity: 1; }
        .bite-mark { position: fixed; width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, rgba(220,0,0,1) 0%, rgba(150,0,0,0.6) 50%, transparent 70%); pointer-events: none; z-index: 5001; animation: biteFade 4s forwards; }
        @keyframes biteFade { 0% { transform: scale(0); opacity: 1; } 20% { transform: scale(2); opacity: 0.9; } 100% { transform: scale(1); opacity: 0; } }

        /* 排行榜 */
        .leaderboard-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 50000; animation: fadeIn 0.3s ease; }
        .leaderboard-overlay.active { display: flex; }
        .leaderboard-box { background: #1a1a1a; border: 1px solid #444; border-radius: 16px; padding: 25px; max-width: 340px; width: 90%; max-height: 70vh; overflow-y: auto; }
        .leaderboard-box h2 { color: #ff4444; text-align: center; margin-bottom: 20px; font-size: 20px; }
        .lb-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #333; font-size: 14px; }
        .lb-item:last-child { border-bottom: none; }
        .lb-rank { width: 30px; font-weight: bold; }
        .lb-rank.gold { color: #ffd700; }
        .lb-rank.silver { color: #c0c0c0; }
        .lb-rank.bronze { color: #cd7f32; }
        .lb-name { flex: 1; color: #fff; padding: 0 10px; }
        .lb-score { color: #ff4444; font-weight: bold; }
        .lb-close { background: #333; color: #fff; border: none; padding: 10px; border-radius: 8px; width: 100%; margin-top: 15px; cursor: pointer; font-size: 15px; }

        /* 连击提示 */
        .combo-text { position: fixed; font-size: 36px; font-weight: bold; color: #ff4444; pointer-events: none; z-index: 10002; animation: comboUp 1s forwards; text-shadow: 0 0 20px rgba(255,68,68,1); }
        @keyframes comboUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-120px) scale(2); opacity: 0; } }

        /* 结束画面 */
        .game-over-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 40000; color: #fff; text-align: center; padding: 20px; }
        .game-over-overlay.active { display: flex; animation: fadeIn 0.5s ease; }
        .game-over-overlay h1 { font-size: 36px; color: #ff4444; margin-bottom: 10px; }
        .game-over-overlay .final-score { font-size: 60px; font-weight: bold; color: #ffaa00; margin: 15px 0; text-shadow: 0 0 30px rgba(255,170,0,0.6); }
        .game-over-overlay .rank-text { font-size: 18px; color: #ccc; margin-bottom: 25px; }
        .game-over-overlay .btn-group { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .game-over-overlay button { padding: 14px 32px; border-radius: 25px; border: none; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-restart { background: #07c160; color: #fff; }
        .btn-share { background: #ff4444; color: #fff; }
        .btn-rank { background: #333; color: #fff; border: 1px solid #555 !important; }

        .scanline { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, transparent 50%, rgba(255,0,0,0.02) 50%); background-size: 100% 4px; pointer-events: none; z-index: 9997; }
        .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.85); color: #fff; padding: 12px 24px; border-radius: 20px; font-size: 14px; z-index: 50000; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
        .toast.show { opacity: 1; }
        .difficulty-indicator { position: fixed; bottom: 65px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 6px 16px; border-radius: 15px; font-size: 12px; color: #ffaa00; z-index: 10000; display: none; border: 1px solid #ffaa00; }
        .difficulty-indicator.show { display: block; }
        .species-label { position: fixed; background: rgba(0,0,0,0.7); color: #fff; padding: 4px 10px; border-radius: 10px; font-size: 11px; pointer-events: none; z-index: 10001; animation: labelFade 2s forwards; }
        @keyframes labelFade { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-30px); } }

        /* 狂暴模式 */
        .frenzy-mode { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 48px; font-weight: bold; color: #ff0000; z-index: 10004; pointer-events: none; animation: frenzyPop 1.5s forwards; text-shadow: 0 0 30px rgba(255,0,0,0.8); display: none; }
        .frenzy-mode.active { display: block; }
        @keyframes frenzyPop { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 70% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }
    </style>
</head>
<body>

    <video id="cameraVideo" autoplay playsinline muted></video>
    <button class="camera-toggle" id="cameraToggle" onclick="toggleCamera()">📷 关闭摄像头</button>
    <div class="scanline"></div>
    <div class="blood-overlay" id="bloodOverlay"></div>

    <div class="wechat-shell" id="wechatShell">
        <div class="wechat-header">
            <div class="back">‹ 微信</div>
            <div class="title" id="chatTitle">文件传输助手</div>
            <div class="more">⋯</div>
        </div>
        <div class="wechat-chat" id="chatArea"></div>
        <div class="wechat-input">
            <div class="voice-icon">🔊</div>
            <div class="input-box">按住 说话</div>
            <div class="emoji-icon">😊</div>
            <div class="plus-icon">➕</div>
        </div>
    </div>

    <div class="game-ui" id="gameUI" style="display:none;">
        <div class="kill-counter">🦟 <span id="killCount">0</span></div>
        <div class="timer-box" id="timerBox">
            <span class="timer-value" id="timerValue">60</span>
            <span>秒</span>
        </div>
        <div class="mode-badges">
            <div class="badge" id="badgeCamera" onclick="toggleCamera()">📷 AR</div>
            <div class="badge" id="badgeWechat" onclick="toggleWechat()">💬 微信</div>
            <div class="badge swat-badge" id="badgeSwat" onclick="toggleSwatMode()">⚡ 电蚊拍</div>
            <div class="badge" onclick="showLeaderboard()">🏆 排行</div>
        </div>
    </div>

    <div class="difficulty-indicator" id="diffIndicator">⚡ 难度升级！蚊子加速了！</div>
    <div class="frenzy-mode" id="frenzyMode">🔥 狂暴模式！🔥</div>

    <div class="start-overlay" id="startOverlay">
        <div class="wx-icon">💬</div>
        <h1>蚊子入侵模拟器</h1>
        <p>超爽击杀，电蚊拍秒杀全场！</p>
        <p style="font-size: 13px; color: #888; margin-top: 5px;">公蚊 | 母蚊 | 花蚊 | 毒蚊 | 金蚊 | 幽灵蚊 | 巨型蚊</p>
        <p style="font-size: 13px; color: #666; margin-top: 5px;">⚡ 电蚊拍可范围秒杀 | 啪！击杀音效 | 爆炸粒子</p>
        <div class="mode-select">
            <div class="mode-btn selected" data-mode="60s" onclick="selectMode(this)">
                <div>⏱️ 限时60秒</div>
                <div style="font-size:12px;color:#888;margin-top:4px;">挑战最高分</div>
            </div>
            <div class="mode-btn" data-mode="endless" onclick="selectMode(this)">
                <div>♾️ 无尽模式</div>
                <div style="font-size:12px;color:#888;margin-top:4px;">无限时间</div>

        // ==================== 音频系统（修复：声音持续 + 击杀音效） ====================
        function initAudio() {
            if (!audioCtx) {

            }
        }

        function startBuzzing() {
            if (!audioCtx) initAudio();
            stopBuzzing();
            
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            lfo = audioCtx.createOscillator();
            lfoGain = audioCtx.createGain();
            
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
            
            lfo.frequency.setValueAtTime(15, audioCtx.currentTime);
            lfoGain.gain.setValueAtTime(50, audioCtx.currentTime);
            lfo.connect(lfoGain);
            lfoGain.connect(oscillator.frequency);
            lfo.start();
            
            gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            
            buzzInterval = setInterval(() => {
                if (oscillator && isFlying) {
                    const freq = 180 + Math.random() * 150;
                    oscillator.frequency.linearRampToValueAtTime(freq, audioCtx.currentTime + 0.3);
                }
            }, 300);
        }

        function stopBuzzing() {
            if (oscillator) {
                try { oscillator.stop(); } catch(e){}
                oscillator.disconnect();
                oscillator = null;
            }
            if (buzzInterval) {
                clearInterval(buzzInterval);
                buzzInterval = null;
            }
        }

        // ==================== 击杀音效（"啪"声） ====================
        function playSlapSound() {
            if (!audioCtx) initAudio();
            // 确保AudioContext处于运行状态（移动端需要用户手势后resume）
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // 白噪声生成器（模拟拍击声）
            const bufferSize = audioCtx.sampleRate * 0.15;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.15));
            }
            
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(1.0, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            
            // 低频冲击
            const impact = audioCtx.createOscillator();
            impact.type = 'square';
            impact.frequency.setValueAtTime(80, audioCtx.currentTime);
            impact.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.1);
            
            const impactGain = audioCtx.createGain();
            impactGain.gain.setValueAtTime(0.7, audioCtx.currentTime);
            impactGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            
            noise.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            impact.connect(impactGain);
            impactGain.connect(audioCtx.destination);
            
            noise.start();
            impact.start();
            impact.stop(audioCtx.currentTime + 0.15);
        }

        // ==================== 电蚊拍音效 ====================
        function playZapSound() {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const zapOsc = audioCtx.createOscillator();
            zapOsc.type = 'sawtooth';
            zapOsc.frequency.setValueAtTime(800, audioCtx.currentTime);
            zapOsc.frequency.exponentialRampToValueAtTime(2000, audioCtx.currentTime + 0.1);
            zapOsc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            
            const zapGain = audioCtx.createGain();
            zapGain.gain.setValueAtTime(0.6, audioCtx.currentTime);
            zapGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            
            zapOsc.connect(zapGain);
            zapGain.connect(audioCtx.destination);
            zapOsc.start();
            zapOsc.stop(audioCtx.currentTime + 0.3);
        }

        // ==================== AI 飞行 ====================
        function getSmartTarget(el) {
            const rect = el.getBoundingClientRect();
            const mx = window.lastMouseX || window.innerWidth / 2;
            const my = window.lastMouseY || window.innerHeight / 2;
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dist = Math.sqrt((mx - cx) ** 2 + (my - cy) ** 2);
            
            let targetX, targetY;
            const margin = 140;
            
            if (dist < 200) {
                const angle = Math.atan2(cy - my, cx - mx);
                const escapeDist = 300 + Math.random() * 200;
                targetX = cx + Math.cos(angle) * escapeDist;
                targetY = cy + Math.sin(angle) * escapeDist;
                showToast('💨 蚊子逃跑了！');
            } else {
                const centerBias = Math.random() > 0.55 ? 0.4 : 0;
                targetX = Math.random() * (window.innerWidth - margin * 2) + margin;
                targetY = Math.random() * (window.innerHeight - margin * 2) + margin;
                if (centerBias) {
                    targetX = targetX * 0.5 + (window.innerWidth / 2) * 0.5;
                    targetY = targetY * 0.5 + (window.innerHeight / 2) * 0.5;
                }
            }
            
            return {
                x: Math.max(margin, Math.min(window.innerWidth - margin - 140, targetX)),
                y: Math.max(margin, Math.min(window.innerHeight - margin - 140, targetY))
            };
        }

        function flyMosquito(el = mosquito) {
            if (el.classList.contains('dead') || isPaused) return;
            
            const target = getSmartTarget(el);
            const rotate = Math.random() * 360 - 180;
            const scale = el.classList.contains('giant') ? 1 : (0.85 + Math.random() * 0.3);
            
            const baseDuration = el.classList.contains('fast') ? 0.5 : 1.0;
            const duration = (baseDuration + Math.random() * 1.8) / flySpeedMultiplier;
            
            el.style.transition = `all ${duration}s cubic-bezier(0.4, 0, 0.2, 1)`;
            el.style.left = target.x + 'px';
            el.style.top = target.y + 'px';
            el.style.transform = `rotate(${rotate}deg) scale(${scale})`;
            
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const distToCenter = Math.sqrt((target.x - centerX) ** 2 + (target.y - centerY) ** 2);
            
            if (distToCenter < 220 && Math.random() > 0.5) {
                setTimeout(() => triggerBite(target.x + 70, target.y + 70), duration * 500);
            }
        }

            flyInterval = setInterval(() => flyMosquito(), mosquitoSpeed);

            breedInterval = setInterval(() => {

                    createBabyMosquito();

                clearInterval(flyInterval);
                flyInterval = setInterval(() => flyMosquito(), mosquitoSpeed);
                
                if (difficultyLevel === 5 && !frenzyMode) {
                    activateFrenzy();

                diffIndicator.classList.add('show');

        // ==================== 击杀系统（带啪音效） ====================
        function killMosquito(el, event, species = 'female') {
            if (el.classList.contains('dead') || isPaused || !isFlying) return;
            
            const points = SPECIES_POINTS[species] || 1;
            
            el.classList.add('dead');
            killCount += points;
            killCountEl.textContent = killCount;
            
            const now = Date.now();
            if (now - lastKillTime < 2500) {
                combo++;
            } else {
                combo = 1;
            }
            lastKillTime = now;
            
            const x = event.clientX || event.pageX || window.innerWidth / 2;
            const y = event.clientY || event.pageY || window.innerHeight / 2;
            
            // 啪！音效
            playSlapSound();
            
            // 爆炸粒子
            const particleColor = species === 'poison' ? '#0f0' : species === 'tiger' ? '#fff' : species === 'gold' ? '#ffd700' : species === 'ghost' ? '#aaf' : '#ff0000';
            createExplosion(x, y, particleColor);
            
            // 屏幕震动
            screenShake();
            
            // 连击提示
            if (combo > 1) {
                showCombo(x, y, combo);
            }
            
            // 暴击提示
            if (combo >= 10) {
                showCrit(x, y);
            }
            
            // 手机震动
            if (navigator.vibrate) {
                const vibePattern = combo >= 10 ? [80, 20, 80, 20, 80, 20, 150] :
                                   combo >= 5 ? [80, 30, 80, 30, 80] : [80];
                navigator.vibrate(vibePattern);
            }
            
            // 血迹
            const rect = el.getBoundingClientRect();
            const blood = document.createElement('div');
            blood.className = 'blood-splatter';
            blood.style.left = (rect.left + 20) + 'px';
            blood.style.top = (rect.top + 20) + 'px';
            document.body.appendChild(blood);
            
            saveScore();
            
            setTimeout(() => {
                el.classList.remove('dead');
                flyMosquito(el);
            }, 2000 + Math.random() * 1000);
            
            setTimeout(() => blood.remove(), 2000);
        }

        function showCombo(x, y, comboCount) {
            const comboEl = document.createElement('div');
            comboEl.className = 'combo-text';
            let text, color;
            if (comboCount >= 15) { text = `🔥🔥🔥 ${comboCount}连击！`; color = '#ff0000'; }
            else if (comboCount >= 10) { text = `🔥🔥 ${comboCount}连击！`; color = '#ff4400'; }
            else if (comboCount >= 5) { text = `🔥 ${comboCount}连击！`; color = '#ff8800'; }
            else { text = `${comboCount}连击！`; color = '#ff4444'; }
            comboEl.textContent = text;
            comboEl.style.left = (x - 50) + 'px';
            comboEl.style.top = (y - 60) + 'px';
            comboEl.style.color = color;
            document.body.appendChild(comboEl);
            setTimeout(() => comboEl.remove(), 1000);
        }

        function showCrit(x, y) {
            const crit = document.createElement('div');
            crit.className = 'crit-text';
            crit.textContent = '暴击！！';
            crit.style.left = (x - 60) + 'px';
            crit.style.top = (y - 80) + 'px';
            document.body.appendChild(crit);
            setTimeout(() => crit.remove(), 800);
        }

        // ==================== 结束游戏 ====================
        function endGame() {
            isFlying = false;
            clearInterval(timerInterval);
            clearInterval(flyInterval);
            clearInterval(breedInterval);
            clearInterval(difficultyInterval);
            clearTimeout(alertTimeout);
            stopBuzzing();

            // 立即停止所有震动
            if (navigator.vibrate) {
                navigator.vibrate(0);
            }
            
            // 关闭电蚊拍模式
            if (swatMode) {
                swatMode = false;
                document.body.style.cursor = 'default';
                document.removeEventListener('click', handleSwatClick, true);
            }
            
            document.getElementById('finalScore').textContent = killCount;
            
            let rankText = '';
            if (killCount >= 80) rankText = '👑 灭蚊之神！传说级！';
            else if (killCount >= 50) rankText = '🏆 灭蚊大师！无人能敌！';
            else if (killCount >= 30) rankText = '⭐ 灭蚊高手！身手不凡！';
            else if (killCount >= 15) rankText = '🔥 灭蚊达人！继续加油！';
            else rankText = '💪 新手灭蚊员，再来一局！';
            
            document.getElementById('rankText').textContent = rankText;
            // 关闭排行榜（如果开着的话）
            document.getElementById('leaderboardOverlay').classList.remove('active');
            gameOverOverlay.classList.add('active');
            
            saveScore();
        }

        function restartGame() {
            gameOverOverlay.classList.remove('active');
            // 同时关闭排行榜和假弹窗
            document.getElementById('leaderboardOverlay').classList.remove('active');
            fakeAlert.classList.remove('active');
            killCount = 0;
            mosquitoCount = 1;
            combo = 0;
            difficultyLevel = 1;
            flySpeedMultiplier = 1;
            mosquitoSpeed = 1400;
            lives = 3;
            frenzyMode = false;
            swatMode = false;
            swatCooldown = false;
            killCountEl.textContent = '0';
            timerBox.classList.remove('urgent');
            timerValue.textContent = '60';
            badgeSwat.classList.remove('active', 'cooldown');
            badgeSwat.textContent = '⚡ 电蚊拍';
            document.body.style.cursor = 'default';
            
            document.querySelectorAll('.mosquito.baby, .mosquito.giant').forEach(el => {
                if (el.dataset.interval) clearInterval(parseInt(el.dataset.interval));
                el.remove();
            });
            
            mosquito.style.left = '10px';
            mosquito.style.top = '10px';
            
            startGame();
        }

        // ==================== 排行榜 ====================
        function saveScore() {
            const scores = JSON.parse(localStorage.getItem('mosquitoScores') || '[]');
            scores.push({ 
                name: '你', 
                score: killCount, 
                mode: gameMode,
                time: Date.now() 
            });
            scores.sort((a, b) => b.score - a.score);
            localStorage.setItem('mosquitoScores', JSON.stringify(scores.slice(0, 20)));
        }

        function updateLeaderboard() {
            const scores = JSON.parse(localStorage.getItem('mosquitoScores') || '[]');
            const lbContent = document.getElementById('lbContent');
            
            if (scores.length === 0) {
                lbContent.innerHTML = '<div class="lb-item"><span class="lb-name">暂无记录</span></div>';
                return;
            }
            
            lbContent.innerHTML = scores.slice(0, 10).map((s, i) => {
                let rankClass = '';
                let rank = `${i+1}.`;
                if (i === 0) { rankClass = 'gold'; rank = '🥇'; }
                else if (i === 1) { rankClass = 'silver'; rank = '🥈'; }
                else if (i === 2) { rankClass = 'bronze'; rank = '🥉'; }
                
                const modeIcon = s.mode === '60s' ? '⏱️' : s.mode === 'survival' ? '💀' : '♾️';
                
                return `<div class="lb-item">
                    <span class="lb-rank ${rankClass}">${rank}</span>
                    <span class="lb-name">${s.name} ${modeIcon}</span>
                    <span class="lb-score">${s.score}只</span>
                </div>`;
            }).join('');
        }

        function showLeaderboard() {
            updateLeaderboard();
            document.getElementById('leaderboardOverlay').classList.add('active');
        }

        function hideLeaderboard() {
            document.getElementById('leaderboardOverlay').classList.remove('active');
        }

        // ==================== 摄像头 ====================
        async function toggleCamera() {
            if (!cameraStream) {
                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'environment' } 
                    });
                    cameraVideo.srcObject = cameraStream;
                    cameraVideo.classList.add('active');
                    cameraToggle.classList.add('show');
                    cameraToggle.textContent = '📷 关闭摄像头';
                    document.getElementById('badgeCamera').classList.add('active');
                    arMode = true;
                    showToast('📷 AR模式已开启！蚊子在现实背景上飞！');
                } catch (err) {
                    showToast('❌ 无法访问摄像头');
                }
            } else {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
                cameraVideo.classList.remove('active');
                cameraToggle.classList.remove('show');
                document.getElementById('badgeCamera').classList.remove('active');
                arMode = false;
                showToast('📷 AR模式已关闭');
            }
        }

        // ==================== 微信界面切换 ====================
        function toggleWechat() {
            wechatMode = !wechatMode;
            if (wechatMode) {
                wechatShell.style.display = 'flex';
                document.getElementById('badgeWechat').classList.add('active');
            } else {
                wechatShell.style.display = 'none';
                document.getElementById('badgeWechat').classList.remove('active');
            }
        }

        // ==================== 分享 ====================
        function shareGame() {
            const url = window.location.href;
            const modeName = gameMode === '60s' ? '限时60秒' : gameMode === 'survival' ? '生存模式' : '无尽模式';
            const text = `我在【蚊子入侵模拟器】${modeName}中消灭了 ${killCount} 只蚊子！你能超过我吗？🦟`;
            
            if (navigator.share) {
                navigator.share({ title: '蚊子入侵模拟器', text: text, url: url })
                    .catch(() => copyToClipboard(url));
            } else {
                copyToClipboard(url);
            }
        }

        function copyToClipboard(text) {
            const input = document.createElement('input');
            input.value = text;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            showToast('链接已复制！快去发给朋友吧~');
        }

        // ==================== Toast ====================
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ==================== 鼠标追踪 ====================
        document.addEventListener('mousemove', (e) => {
            window.lastMouseX = e.clientX;
            window.lastMouseY = e.clientY;
        });
        
        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                window.lastMouseX = e.touches[0].clientX;
                window.lastMouseY = e.touches[0].clientY;
            }
        }, { passive: true });

        document.body.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        window.addEventListener('resize', () => {
            if (isFlying) flyMosquito();
        });
    </script>
</body>
</html>
